name: Bug report
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please don't paste transcripts or notes you wouldn't want public, and report security
        issues privately through [SECURITY.md](../blob/main/SECURITY.md) instead.
  - type: input
    id: version
    attributes:
      label: Super Flow version
      description: Settings → About.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 26.0.1"
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: Mac
      options:
        - Apple silicon
        - Intel
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How was it installed?
      options:
        - One-line installer
        - DMG
        - Built from source
  - type: input
    id: apps
    attributes:
      label: App you were dictating into (or meeting app)
      placeholder: "Slack, Google Meet in Chrome"
  - type: input
    id: models
    attributes:
      label: Models installed
      description: Settings → Models, the ones marked installed.
      placeholder: "Parakeet v3, Whisper base, Qwen3.5-2B"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Hold Fn and say "…"
        2. Let go
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: What the Flow Bar showed (its card, if any) helps a lot.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Console.app, filtered by `com.udsy.superflow`, around the time of the problem.
      render: text
  - type: checkboxes
    id: settings
    attributes:
      label: Relevant settings
      options:
        - label: Accessibility is not allowed
        - label: Input Monitoring is not allowed
        - label: Context awareness is off
        - label: Cleanup level is None, or the app uses "No AI formatting"
        - label: Command Mode is on
        - label: Keep models in memory is off
